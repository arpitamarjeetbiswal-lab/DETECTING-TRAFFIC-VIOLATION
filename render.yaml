services:
  - type: web
    name: trafficvision-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: gunicorn --chdir ai/scripts --workers 1 --threads 2 --timeout 180 --bind 0.0.0.0:$PORT flask_api:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TRAFFIC_DATA_DIR
        value: /tmp/trafficvision-data
      - key: FLASK_DEBUG
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://trafficvision-web.onrender.com

  - type: web
    name: trafficvision-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://trafficvision-api.onrender.com
